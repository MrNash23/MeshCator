[platformio]
src_dir = vendor/meshcore-pager/src
default_envs = meshcator-pager

[env:meshcator-pager]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = vendor/meshcore-pager/lib
board_build.partitions = vendor/meshcore-pager/variants/lilygo_tlora_pager_sx1262/partitions.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 5242880
board_build.f_flash = 80000000L
board_build.flash_mode = dio
build_unflags = -std=gnu++11
build_flags =
 -std=gnu++17
 -I src
 -I config
 -I vendor/meshcore-pager/variants/lilygo_tlora_pager_sx1262
 -I vendor/meshcore-pager/examples/companion_radio
 -I vendor/meshcore-pager/examples/companion_radio/ui-new
 -D ENABLE_USB_INTERFACE
 -D ESP32_PLATFORM
 -D MESHCATOR_UI=1
 -D T_LORA_PAGER_SX1262
 -D USE_SX1262
 -D RADIO_CLASS=CustomSX1262
 -D WRAPPER_CLASS=CustomSX1262Wrapper
 -D LORA_FREQ=869.618
 -D LORA_BW=62.5
 -D LORA_SF=8
 -D LORA_CR=5
 -D LORA_TX_POWER=14
 -D ENABLE_ADVERT_ON_BOOT=0
 -D SX126X_DIO2_AS_RF_SWITCH=true
 -D SX126X_DIO3_TCXO_VOLTAGE=1.8
 -D SX126X_RX_BOOSTED_GAIN=1
 -D SX126X_CURRENT_LIMIT=140
 -D P_LORA_NSS=36
 -D P_LORA_DIO_1=14
 -D P_LORA_RESET=47
 -D P_LORA_BUSY=48
 -D P_LORA_SCLK=35
 -D P_LORA_MISO=33
 -D P_LORA_MOSI=34
 -D PIN_BOARD_SDA=3
 -D PIN_BOARD_SCL=2
 -D PIN_GPS_RX=12
 -D PIN_GPS_TX=4
 -D GPS_BAUD_RATE=38400
 -D ENV_INCLUDE_GPS=1
 -D ENV_SKIP_GPS_DETECT=1
 -D PERSISTANT_GPS=1
 -D BOARD_I2S_WS=18
 -D BOARD_I2S_BCK=11
 -D BOARD_I2S_MCLK=10
 -D BOARD_I2S_DOUT=45
 -D BOARD_I2S_DIN=17
 -D AUDIO_ENABLED_DEFAULT=0
 -D AUDIO_DEFAULT_VOLUME=35
 -D SCREEN_DIM_SECS=30
 -D SCREEN_OFF_SECS=90
 -D GPS_ON_SECS=30
 -D GPS_OFF_SECS=270
 -D POWER_DISABLE_BLE=0
 -D BLE_PIN_CODE=123456
 -D BLE_NAME_PREFIX='"MeshCator-"'
 -D PIN_SIDE_BTN=0
 -D ARDUINO_USB_MODE=1
 -D ARDUINO_USB_CDC_ON_BOOT=1
 -D BOARD_HAS_PSRAM
 -D MAX_CONTACTS=350
 -D MAX_GROUP_CHANNELS=40
 -D OFFLINE_QUEUE_SIZE=256
 -D DISPLAY_CLASS=TPagerST7796Display
 -D UI_ZOOM=2
 -D PIN_USER_BTN=7
 -D PIN_ENCODER_A=40
 -D PIN_ENCODER_B=41
 -D LV_CONF_INCLUDE_SIMPLE
 -D LV_LVGL_H_INCLUDE_SIMPLE
 -D RADIOLIB_STATIC_ONLY=1
 -D RADIOLIB_GODMODE=1
 -D FIRMWARE_VERSION='"MeshCator-0.3.8-dev"'
build_src_filter =
 +<*.cpp>
 +<helpers/*.cpp>
 +<helpers/radiolib/*.cpp>
 +<helpers/bridges/BridgeBase.cpp>
 +<helpers/ui/MomentaryButton.cpp>
 +<helpers/ui/LGFXDisplay.cpp>
 +<helpers/esp32/*.cpp>
 +<helpers/sensors>
 +<../examples/companion_radio/*.cpp>
 +<../examples/companion_radio/ui-new/*.cpp>
 -<../examples/companion_radio/ui-new/UITask.cpp>
 +<../variants/lilygo_tlora_pager_sx1262/target.cpp>
 +<../variants/lilygo_tlora_pager_sx1262/PowerManager.cpp>
 +<../variants/lilygo_tlora_pager_sx1262/AudioManager.cpp>
 +<../../../src/core/*.cpp>
 +<../../../src/ui/*.cpp>
 +<../../../src/ui/fonts/*.c>
 +<../../../src/hal/*.cpp>
lib_deps =
 https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
 rweather/Crypto @ 0.4.0
 adafruit/Adafruit DRV2605 Library @ 1.2.4
 adafruit/RTClib @ 2.1.4
 melopero/Melopero RV3028 @ 1.2.0
 electroniccats/CayenneLPP @ 1.6.1
 stevemarple/MicroNMEA @ 2.0.6
 lovyan03/LovyanGFX @ 1.2.7
 adafruit/Adafruit TCA8418 @ 1.0.2
 lvgl/lvgl @ 9.2.2
 densaugeo/base64 @ 1.4.0

; Device-specific additional slot; never upload this environment with a generic
; pio upload command (which would also replace the existing bootloader).
[env:meshcator-launcher]
extends = env:meshcator-pager
board_build.partitions = config/partitions-launcher.csv
board_upload.maximum_size = 2359296
build_flags =
 ${env:meshcator-pager.build_flags}
 -D MESHCATOR_FS_LABEL='"mcfs"'
 -D MESHCATOR_LAUNCHER=1

; Size/capability evaluation only, not an installation target.
[env:meshcator-ble-eval]
extends = env:meshcator-pager
build_flags =
 ${env:meshcator-pager.build_flags}
 -UPOWER_DISABLE_BLE
 -D POWER_DISABLE_BLE=0
 -D BLE_PIN_CODE=123456
 -D BLE_NAME_PREFIX='"MeshCator-"'
