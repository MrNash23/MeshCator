name: Build MeshCator
on: [push, pull_request]
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev zlib1g-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure
      - run: SDL_VIDEODRIVER=dummy ./build/meshcator --smoke --screen 2 --screenshot build/radar.bmp
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - run: pio run -e meshcator-pager
      - uses: actions/upload-artifact@v4
        with:
          name: meshcator-pager-development
          path: .pio/build/meshcator-pager/firmware.bin
